<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <!-- Pestaña del navegador e icono de app instalada: el sello histórico de
         la Facultad de Ciencias (1923), sobre el papel de la aplicación.

         El .ico va primero y con un tamaño declarado: así los navegadores que
         entienden SVG se quedan con el vectorial —nítido a cualquier tamaño y
         con las letras del anillo en blanco si el sistema está en oscuro— y
         los que no, siguen teniendo su mapa de bits de 16/32/48. -->
    <link rel="icon" href="/unizar_dashboard/favicon.ico" sizes="32x32">
    <link rel="icon" href="/unizar_dashboard/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/unizar_dashboard/apple-touch-icon.png">
    <link rel="manifest" href="/unizar_dashboard/manifest.webmanifest">
    <!-- El mismo azul que la cabecera: la barra del navegador es su
         continuación, y un tono distinto se lee como una costura. -->
    <meta name="theme-color" content="#1b3559">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- El título es también la red de seguridad: es lo que enseñan la pestaña,
         Google, un marcador y cualquier cliente de mensajería al que le falle
         el Open Graph de abajo. "Dashboard Unizar" no decía de qué. -->
    <title>Dashboard del Grado en Física · Unizar</title>
    <meta name="description" content="Estadísticas del Grado en Física de la Universidad de Zaragoza: dificultad de cada asignatura, notas de corte, horarios y profesorado, con los datos oficiales.">

    <!-- La tarjeta que enseñan WhatsApp, Telegram, Slack y compañía al pegar
         el enlace. Va aquí, en el HTML estático, y no en una vista: quien la
         lee es un rastreador que descarga el documento y no ejecuta nada, así
         que cualquier etiqueta que pusiera Vue al montar llegaría tarde.

         Por el mismo motivo la tarjeta es una sola para toda la web: como las
         rutas van tras la almohadilla, el rastreador nunca llega a saber qué
         pantalla se ha compartido —el navegador no manda el fragmento— y
         siempre pide este mismo index.html.

         Las URL son absolutas y con dominio a propósito: una ruta relativa
         funciona en el navegador pero no la resuelve ningún rastreador.
         La imagen se genera desde docs/og-card.html; el recorte de 1200x630 y
         los 100 kB largos son los que WhatsApp enseña grandes en vez de como
         miniatura. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Dashboard del Grado en Física">
    <meta property="og:locale" content="es_ES">
    <meta property="og:url" content="https://aaleta.github.io/unizar_dashboard/">
    <meta property="og:title" content="Dashboard del Grado en Física · Unizar">
    <meta property="og:description" content="Dificultad de cada asignatura, notas de corte, horarios y profesorado — con los datos oficiales de la Universidad de Zaragoza.">
    <meta property="og:image" content="https://aaleta.github.io/unizar_dashboard/og-image.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Sello de la Facultad de Ciencias junto al título «Dashboard del Grado en Física», sobre fondo azul.">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Dashboard del Grado en Física · Unizar">
    <meta name="twitter:description" content="Dificultad de cada asignatura, notas de corte, horarios y profesorado — con los datos oficiales de la Universidad de Zaragoza.">
    <meta name="twitter:image" content="https://aaleta.github.io/unizar_dashboard/og-image.png">
    <script type="module" crossorigin src="/unizar_dashboard/assets/index-DrJNexSR.js"></script>
    <link rel="modulepreload" crossorigin href="/unizar_dashboard/assets/_plugin-vue_export-helper-CmkoNBm6.js">
    <link rel="stylesheet" crossorigin href="/unizar_dashboard/assets/index-Cxo-PTlP.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
